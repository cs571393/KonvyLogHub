<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konvy Log Dashboard v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --text-color: #d4d4d4;
            --border-color: #333;
            --accent-color: #007acc;
            --log-info: #6a9955;
            --log-warn: #d7ba7d;
            --log-error: #f48771;
            --log-socket: #b267e6;
            --method-get: #61affe;
            --method-post: #49cc90;
            --method-put: #fca130;
            --method-delete: #f93e3e;
            --status-ok: #49cc90;
            --status-error: #f93e3e;
        }
        body, html { height: 100%; margin: 0; font-family: 'Consolas', 'Monaco', monospace; background: var(--bg-color); color: var(--text-color); overflow: hidden; }
        .container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 320px; min-width: 320px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .device-list { flex: 1; overflow-y: auto; }
        .device-group { border-bottom: 1px solid var(--border-color); }
        .device-item { padding: 12px 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; transition: background 0.2s; }
        .device-item:hover { background: #2a2d2e; }
        .device-item.active { background: #37373d; border-left: 4px solid var(--accent-color); }
        .chevron { width: 12px; height: 12px; transition: transform 0.3s; fill: #858585; }
        .device-group.expanded .chevron { transform: rotate(90deg); }
        .device-details { display: none; background: #1a1a1b; padding: 10px 15px; font-size: 11px; border-top: 1px solid #333; }
        .device-group.expanded .device-details { display: block; }
        .info-row { display: flex; padding: 6px 0; border-bottom: 1px solid #252526; align-items: center; }
        .info-key { width: 85px; color: #858585; flex-shrink: 0; }
        .info-val { color: #ce9178; word-break: break-all; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
        .copy-btn { color: var(--accent-color); cursor: pointer; font-size: 10px; margin-left: 5px; flex-shrink: 0; }
        .copy-btn:hover { text-decoration: underline; }
        
        .command-zone { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
        .command-input { width: 100%; background: #111; border: 1px solid #444; color: #d4d4d4; padding: 5px; font-size: 11px; border-radius: 3px; box-sizing: border-box; margin-bottom: 5px; }
        .command-btn { width: 100%; background: var(--accent-color); color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .command-btn:hover { background: #005a9e; }
        
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .tabs { display: flex; background: #2d2d2d; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .tab { padding: 10px 20px; cursor: pointer; font-size: 12px; color: #858585; border-right: 1px solid var(--border-color); background: #252526; }
        .tab:hover { background: #2a2d2e; color: #d4d4d4; }
        .tab.active { background: var(--bg-color); color: var(--text-color); border-top: 2px solid var(--accent-color); }
        .view-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { height: 45px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 15px; gap: 10px; flex-shrink: 0; }
        
        /* Log Styling */
        .log-container { flex: 1; overflow-y: auto; padding: 12px; font-size: 12px; line-height: 1.6; }
        .log-entry { margin-bottom: 8px; padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,0.02); border-left: 3px solid transparent; white-space: pre-wrap; word-break: break-all; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
        .log-info-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .time { color: #858585; font-weight: bold; font-family: 'Courier New', monospace; }
        .tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .device-name-tag { color: #569cd6; font-weight: bold; }
        .log-content { color: #ce9178; flex: 1; min-width: 300px; }

        /* JSON Search */
        .json-search-container { display: flex; align-items: center; gap: 5px; }
        .json-search-input { background: #111; border: 1px solid #444; color: #d4d4d4; padding: 2px 6px; font-size: 10px; border-radius: 3px; width: 100px; transition: width 0.2s; }
        .json-search-input:focus { width: 150px; border-color: var(--accent-color); }
        .search-match { background: #634b12; color: #fff; border-radius: 2px; }
        .search-match.current { background: #cc7a00; box-shadow: 0 0 5px rgba(255,255,255,0.5); font-weight: bold; }
        .nav-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 0 5px; font-size: 10px; cursor: pointer; border-radius: 2px; }
        .nav-btn:hover { background: #444; }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }

        /* Network Table */
        .network-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        .network-table th { text-align: left; padding: 10px 8px; background: #252526; color: #858585; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); }
        .network-table td { padding: 10px 8px; border-bottom: 1px solid #2d2d2d; color: #d4d4d4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: break-all; }
        .network-row { cursor: pointer; transition: background 0.1s; }
        .network-row:hover { background: #2a2d2e; }
        .network-row.expanded { background: #37373d; }
        .network-row td { white-space: nowrap; }
        .network-row.expanded td { white-space: normal; }
        .method-tag { font-weight: bold; font-size: 10px; padding: 2px 5px; border-radius: 3px; color: #fff; display: inline-block; width: 45px; text-align: center; }
        .status-tag { color: var(--status-ok); font-weight: bold; }
        .status-tag.error { color: var(--status-error); }
        .network-details { background: #1a1a1b; padding: 0; border-bottom: 2px solid var(--accent-color); display: none; }
        .network-row.expanded + .network-details-row .network-details { display: block; }
        .detail-section { margin-bottom: 0; border-bottom: 1px solid #333; }
        .detail-header { display: flex; align-items: center; padding: 10px 15px; background: #252526; gap: 12px; flex-wrap: wrap; }
        .detail-title { font-weight: bold; color: #858585; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Breadcrumb Bar */
        .json-breadcrumb { 
            background: #1e1e1e; 
            padding: 4px 15px; 
            font-size: 10px; 
            color: #888; 
            border-bottom: 1px solid #2d2d2d;
            position: sticky;
            top: 0;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            min-height: 14px;
        }
        .json-breadcrumb:hover { color: var(--accent-color); background: #252526; }
        .json-breadcrumb span { color: #569cd6; font-weight: bold; }

        .detail-content { background: #111; padding: 10px 15px; overflow: auto; font-size: 11px; max-height: 500px; position: relative; }

        /* Enhanced JSON Tree */
        .json-tree { line-height: 1.4; color: #d4d4d4; padding-bottom: 10px; }
        .json-item { margin: 0; padding: 0; }
        .json-summary { cursor: pointer; color: #858585; outline: none; list-style: none; display: flex; align-items: center; padding: 1px 0; font-size: 11px; }
        .json-summary::-webkit-details-marker { display: none; }
        .json-summary::before { content: '▶'; display: inline-block; width: 14px; font-size: 7px; transition: transform 0.1s; margin-right: 2px; text-align: center; }
        details[open] > .json-summary::before { transform: rotate(90deg); }
        .json-key { color: #9cdcfe; margin-right: 4px; cursor: crosshair; }
        .json-string { color: #ce9178; }
        .json-number { color: #b5cea8; }
        .json-boolean, .json-null { color: #569cd6; }
        .json-row { margin: 1px 0; display: flex; align-items: flex-start; padding-left: 14px; transition: background 0.1s; border-radius: 2px; }
        .json-row:hover { background: rgba(255,255,255,0.05); }
        .json-content { border-left: 1px solid rgba(255,255,255,0.1); margin-left: 6px; padding-left: 8px; transition: border-color 0.2s; }
        .json-row:hover > .json-content { border-left-color: var(--accent-color); }
        .json-size { color: #569cd6; font-size: 10px; margin-left: 6px; opacity: 0.5; font-style: italic; }
        .network-row.selected { background: rgba(0, 122, 204, 0.2) !important; }
        .compare-bar { position: fixed; bottom: 20px; right: 20px; background: var(--accent-color); color: white; padding: 10px 20px; border-radius: 20px; display: none; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; cursor: pointer; }
        
        /* Modal Styling */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { width: 95%; height: 90%; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .modal-body { flex: 1; overflow: auto; padding: 0; }
        
        .compare-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        .compare-table th, .compare-table td { padding: 10px; border: 1px solid #333; word-break: break-all; vertical-align: top; }
        .compare-table th { background: #252526; color: #858585; position: sticky; left: 0; z-index: 5; text-align: left; width: 150px; }
        .compare-table td { background: #1e1e1e; }
        .compare-table tr.same-row { display: table-row; }
        .compare-table.hide-same tr.same-row { display: none; }
        .diff-tag { background: #4b1111; padding: 2px 4px; border-radius: 2px; }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { 
                position: fixed; 
                left: -320px; 
                top: 0; 
                bottom: 0; 
                z-index: 3000; 
                transition: left 0.3s; 
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar.show { left: 0; }
            .mobile-menu-btn { 
                display: block !important; 
                background: var(--sidebar-bg); 
                color: var(--text-color); 
                border: none; 
                padding: 10px; 
                cursor: pointer;
                border-bottom: 1px solid var(--border-color);
            }
            .main { width: 100%; height: 100vh; display: flex; flex-direction: column; }
            .view-content { flex: 1; min-height: 0; overflow: hidden; }
            .log-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .tabs { overflow-x: auto; white-space: nowrap; }
            .tab { padding: 10px 15px; flex-shrink: 0; }
            .toolbar { flex-wrap: wrap; height: auto; padding: 10px; gap: 8px; }
            .toolbar { flex-wrap: wrap; height: auto; padding: 10px; gap: 8px; }
            .toolbar input, .toolbar select { flex: 1; min-width: 120px; }
            .network-table, .network-table thead, .network-table tbody, .network-table tr, .network-table th, .network-table td { 
                display: block; width: 100%; box-sizing: border-box; 
            }
            .network-table thead { display: none; }
            .network-row { 
                padding: 12px; border-bottom: 1px solid #333; cursor: pointer; 
                display: flex !important; flex-wrap: wrap; gap: 8px; align-items: center;
                position: relative; z-index: 10;
            }
            .network-row td { 
                display: inline-block !important; width: auto !important; padding: 0 !important; 
                border: none !important; white-space: normal !important; word-break: break-all !important; 
            }
            .network-row td:nth-child(4) { width: 100% !important; order: 10; color: #ce9178; font-size: 11px; margin-top: 4px; }
            .network-details-row { display: none; }
            .network-row.expanded + .network-details-row { display: block; border-bottom: 2px solid var(--accent-color); }
            .network-row.expanded + .network-details-row .network-details { display: block; }
            .detail-content { max-height: 350px !important; }
            .json-breadcrumb { position: relative; top: 0; z-index: 5; }
            .log-entry { font-size: 11px; padding: 6px; }
            .log-info-meta { flex-direction: column; align-items: flex-start; gap: 2px; }
            .modal-content { width: 100%; height: 100%; border-radius: 0; }
            .compare-table th { width: 80px; font-size: 10px; }
            .compare-bar { left: 10px; right: 10px; bottom: 10px; border-radius: 8px; justify-content: center; }
        }
        .mobile-menu-btn { display: none; }
        .sidebar-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.5); z-index: 2999; display: none; 
        }
        .sidebar-overlay.show { display: block; }
    </style>
</head>
<body>
    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰ 选择设备 / 菜单</button>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
    <div id="compare-bar" class="compare-bar" onclick="showCompareModal()">
        <span id="compare-count">已选中 0 个请求</span>
        <strong>开始对比</strong>
    </div>

    <div id="compare-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display:flex; align-items:center; gap: 20px; flex: 1;">
                    <strong style="font-size:16px;">API 参数对比</strong>
                    <div style="display:flex; gap:12px; font-size:11px; background: #111; padding: 4px 10px; border-radius: 4px; border: 1px solid #333;">
                        <label style="cursor:pointer; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="show-url-params" checked onchange="showCompareModal()"> URL参数</label>
                        <label style="cursor:pointer; display:flex; align-items:center; gap:4px; margin-left:10px; border-left: 1px solid #444; padding-left:10px;"><input type="checkbox" id="show-req-headers" checked onchange="showCompareModal()"> 请求头</label>
                        <label style="cursor:pointer; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="show-req-body" checked onchange="showCompareModal()"> 请求体</label>
                        <label style="cursor:pointer; display:flex; align-items:center; gap:4px; margin-left:10px; border-left: 1px solid #444; padding-left:10px;"><input type="checkbox" id="show-res-headers" onchange="showCompareModal()"> 响应头</label>
                        <label style="cursor:pointer; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="show-res-body" onchange="showCompareModal()"> 响应体</label>
                    </div>
                    <label style="font-size:12px; display:flex; align-items:center; gap:5px; cursor:pointer; margin-left: 10px;">
                        <input type="checkbox" id="hide-same-toggle" onchange="toggleHideSame()"> 隐藏相同项
                    </label>
                </div>
                <button onclick="closeCompareModal()" style="padding: 5px 15px; cursor:pointer;">关闭</button>
            </div>
            <div id="compare-body" class="modal-body"></div>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">设备列表 (Devices)</div>
            <div id="device-list" class="device-list"></div>
            <div style="padding: 10px; display: flex; gap: 5px;">
                <button style="flex: 1;" onclick="clearLogs()">清空日志</button>
                <button style="background: #a33;" onclick="resetDevices()">重置设备</button>
            </div>
        </div>
        <div class="main">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('logs')" id="tab-logs">日志 (Logs)</div>
                <div class="tab" onclick="switchTab('network')" id="tab-network">网络 (Network)</div>
                <div class="tab" onclick="switchTab('socket')" id="tab-socket">Socket</div>
            </div>
            <div id="view-logs" class="view-content">
                <div class="toolbar">
                    <input type="text" id="searchInput" placeholder="搜索内容..." style="width: 180px;">
                    <select id="levelFilter" onchange="refreshDisplay()">
                        <option value="all">所有级别 (All)</option>
                    </select>
                    <button id="sortBtn" onclick="toggleSort()">排序: 最新优先 ↓</button>
                    <div style="flex:1"></div>
                    <div id="status" style="font-size:10px; color:#666">Status: Disconnected</div>
                </div>
                <div id="log-container" class="log-container"><div id="log-list"></div></div>
            </div>
            <div id="view-network" class="view-content" style="display:none">
                <div class="toolbar">
                    <input type="text" id="networkSearchInput" placeholder="搜索 URL/Method..." style="width: 180px;" oninput="refreshNetworkDisplay()">
                    <div id="selection-tips" style="margin-left: 15px; font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 10px;">
                        <span>💡 按住 <b>Ctrl/Cmd + 点击</b> 可多选对比</span>
                        <button id="clear-selection-btn" onclick="clearNetworkSelection()" style="display:none; padding: 2px 8px; font-size: 10px; cursor: pointer;">取消选择</button>
                    </div>
                    <div style="flex:1"></div>
                    <span style="font-size:11px; color: #858585" id="network-count">0 requests</span>
                </div>
                <div class="log-container" style="padding: 0;">
                    <table class="network-table">
                        <thead>
                            <tr>
                                <th style="width: 90px;">Time</th>
                                <th style="width: 70px;">Method</th>
                                <th style="width: 60px;">Status</th>
                                <th>URL</th>
                                <th style="width: 80px;">Duration</th>
                            </tr>
                        </thead>
                        <tbody id="network-list"></tbody>
                    </table>
                </div>
            </div>
            <div id="view-socket" class="view-content" style="display:none">
                <div class="toolbar">
                    <input type="text" id="socketSearchInput" placeholder="搜索 Action/内容..." style="width: 180px;" 
                        oninput="refreshSocketDisplay()" onkeydown="if(event.key==='Enter') navSocketSearch(1)">
                    <div class="json-search-container" id="socket-search-nav" style="display:none; margin-left: 10px;">
                        <button class="nav-btn" onclick="navSocketSearch(-1)">◀</button>
                        <button class="nav-btn" onclick="navSocketSearch(1)">▶</button>
                        <span id="socket-search-count" style="font-size:10px; color:#666; margin-left: 5px;">0/0</span>
                    </div>
                    <div style="flex:1"></div>
                    <span style="font-size:11px; color: #858585" id="socket-count">0 messages</span>
                </div>
                <div class="log-container"><div id="socket-list"></div></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dehcpksgjhyvoyccafnj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlaGNwa3Nnamh5dm95Y2NhZm5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NzU5MzAsImV4cCI6MjA4NTU1MTkzMH0.f51lBltot16OF2HmifWqUdl4sOe1SOO7f4c5k5rMAqg';
        const REPORT_API = 'https://konvyloghub.pages.dev/report';
        let currentDeviceId = localStorage.getItem('last_selected_device') || null;
        let sortDesc = true;
        let allLogs = [];
        let networkLogs = [];
        let socketLogs = [];
        let currentTab = 'logs';
        const observedLevels = new Set();
        let devices = new Map();
        const searchState = new Map(); 
        let selectedNetworkLogs = new Set();

        try {
            const saved = localStorage.getItem('konvy_devices');
            if (saved) devices = new Map(JSON.parse(saved));
        } catch (e) { console.error(e); }

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
        const channel = _supabase.channel('konvy-logs', { config: { broadcast: { self: false } } });

        updateDeviceList();
        channel.on('broadcast', { event: 'log-event' }, ({ payload }) => {
            const parsed = payload.data || payload; 
            const items = Array.isArray(parsed) ? parsed : [parsed];
            items.forEach(item => { const log = processItem(item); if (log) appendToUI(log); });
            // 每次收到新设备数据时，可能需要刷新设备列表（如果是新设备或从无到有）
            updateDeviceList();
        }).subscribe(s => { document.getElementById('status').innerText = 'Status: ' + s; });

        function processItem(log) {
            const dId = log.deviceId || log.device_id || 'unknown';
            const dName = log.deviceName || log.device_name || 'Unknown Device';
            if (!devices.has(dId) || log.metadata) {
                devices.set(dId, { name: dName, metadata: log.metadata || (devices.get(dId)||{}).metadata || {} });
                localStorage.setItem('konvy_devices', JSON.stringify(Array.from(devices.entries())));
                updateDeviceList();
            }
            let processed;
            // 更加宽松的 Socket 日志识别逻辑
            const isSocket = log.type === 'socket' || 
                             (log.level && log.level.toString().toLowerCase() === 'socket') ||
                             (log.action && !log.method); // 如果有 action 但没有 method，通常是 socket
            
            if (log.type === 'network') {
                processed = { 
                    id: dId, 
                    logId: 'net_' + Math.random().toString(36).substr(2, 9),
                    name: dName, 
                    method: (log.method || 'GET').toUpperCase(), 
                    url: log.url || '', 
                    status: log.status || 0, 
                    duration: log.duration || 0, 
                    reqHeaders: log.request?.headers, 
                    reqBody: log.request?.body, 
                    resHeaders: log.response?.headers, 
                    resBody: log.response?.body, 
                    ts: log.timestamp ? log.timestamp * 1000 : Date.now(), 
                    timeStr: formatTime(log.timestamp ? log.timestamp * 1000 : Date.now()), 
                    type: 'network' 
                };
                networkLogs.push(processed);
                if (networkLogs.length > 1000) networkLogs.shift();
            } else if (isSocket) {
                processed = {
                    id: dId,
                    name: dName,
                    action: (log.action || 'SOCKET').toString().toUpperCase(),
                    content: log.content || '',
                    ts: log.timestamp ? log.timestamp * 1000 : Date.now(),
                    timeStr: formatTime(log.timestamp ? log.timestamp * 1000 : Date.now()),
                    type: 'socket'
                };
                socketLogs.push(processed);
                if (socketLogs.length > 2000) socketLogs.shift();
                
                // 【额外增强】同时也存入普通日志队列，确保万一 Socket Tab 挂了，Logs 里也能搜到
                const fallbackLog = { 
                    id: dId, name: dName, level: 'socket', 
                    content: `[Socket:${processed.action}] ${typeof processed.content === 'object' ? JSON.stringify(processed.content) : processed.content}`, 
                    ts: processed.ts, timeStr: processed.timeStr, type: 'log' 
                };
                allLogs.push(fallbackLog);
                if (allLogs.length > 3000) allLogs.shift();
            } else {
                const level = (log.level || 'info').toLowerCase();
                if (!observedLevels.has(level)) { observedLevels.add(level); updateLevelFilter(); }
                processed = { id: dId, name: dName, level, content: log.content, ts: log.timestamp ? log.timestamp * 1000 : Date.now(), timeStr: formatTime(log.timestamp ? log.timestamp * 1000 : Date.now()), type: 'log' };
                allLogs.push(processed);
                if (allLogs.length > 3000) allLogs.shift();
            }
            return processed;
        }

                const list = document.getElementById('socket-list');

        function updateCompareBar() {

        function showCompareModal() {
            const logs = networkLogs.filter(l => selectedNetworkLogs.has(l.logId));
            const body = document.getElementById('compare-body');
            document.getElementById('compare-modal').style.display = 'flex';
            
            if (logs.length === 0) {
                body.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">未找到选中的请求数据</div>';
                return;
            }

            const filter = {
                urlParams: document.getElementById('show-url-params').checked,
                reqHeaders: document.getElementById('show-req-headers').checked,
                reqBody: document.getElementById('show-req-body').checked,
                resHeaders: document.getElementById('show-res-headers').checked,
                resBody: document.getElementById('show-res-body').checked
            };

            // 提取所有可能的字段
            const allKeys = new Set();
            const dataMap = logs.map(l => {
                const flat = {};
                // 基础字段永远包含
                flat["_Info.URL"] = l.url;
                flat["_Info.Method"] = l.method;
                flat["_Info.Status"] = l.status;
                flat["_Info.Duration"] = l.duration + "ms";
                allKeys.add("_Info.URL"); allKeys.add("_Info.Method"); allKeys.add("_Info.Status"); allKeys.add("_Info.Duration");

                // 解析 URL 参数
                if (filter.urlParams && l.url.includes('?')) {
                    try {
                        const search = l.url.split('?')[1];
                        const params = new URLSearchParams(search);
                        for (const [key, value] of params.entries()) {
                            const path = `URL.Param.${key}`;
                            flat[path] = value;
                            allKeys.add(path);
                        }
                    } catch (e) { console.error("URL Parse error", e); }
                }

                const process = (prefix, obj, shouldProcess) => {
                    if (!shouldProcess || obj === null || obj === undefined) return;
                    if (typeof obj !== 'object') {
                        flat[prefix] = obj;
                        allKeys.add(prefix);
                        return;
                    }
                    Object.entries(obj).forEach(([k, v]) => {
                        const path = prefix ? `${prefix}.${k}` : k;
                        if (v !== null && typeof v === 'object') process(path, v, true);
                        else { flat[path] = v; allKeys.add(path); }
                    });
                };

                process('Req.Headers', l.reqHeaders, filter.reqHeaders);
                process('Req.Body', l.reqBody, filter.reqBody);
                process('Res.Headers', l.resHeaders, filter.resHeaders);
                process('Res.Body', l.resBody, filter.resBody);
                return flat;
            });

            const sortedKeys = Array.from(allKeys).sort((a, b) => {
                if (a.startsWith('_') && !b.startsWith('_')) return -1;
                if (!a.startsWith('_') && b.startsWith('_')) return 1;
                return a.localeCompare(b);
            });

            let html = `<table class="compare-table" id="compare-table-el"><thead><tr><th>Key</th>`;
            logs.forEach(l => html += `<th>${l.method} ${l.timeStr}</th>`);
            html += `</tr></thead><tbody>`;

            sortedKeys.forEach(key => {
                const values = dataMap.map(d => d[key]);
                const isSame = values.every(v => JSON.stringify(v) === JSON.stringify(values[0]));
                const displayKey = key.startsWith('_Info.') ? key.replace('_Info.', '') : key;
                
                html += `<tr class="${isSame ? 'same-row' : 'diff-row'}">
                    <th style="${key.startsWith('_Info.') ? 'color: var(--accent-color); font-weight:bold;' : ''}">${displayKey}</th>`;
                
                values.forEach((v, i) => {
                    const displayVal = (v === undefined) ? '<span style="color:#666">N/A</span>' : 
                                      (typeof v === 'string' ? v : JSON.stringify(v));
                    const isDiff = !isSame && JSON.stringify(v) !== JSON.stringify(values[0]) && i > 0;
                    html += `<td><span class="${isDiff ? 'diff-tag' : ''}">${displayVal}</span></td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            body.innerHTML = html;
            toggleHideSame(); // 重新应用隐藏相同项的逻辑
        }

        function toggleHideSame() {
            const table = document.getElementById('compare-table-el');
            const hide = document.getElementById('hide-same-toggle').checked;

        }

        function createLogRow(log) {
            const div = document.createElement('div'); div.className = 'log-entry';

        function createSocketRow(log) {
            const div = document.createElement('div'); div.className = 'log-entry';
            const actionColors = {
                'SEND': '#49cc90', 
                'RECEIVED': '#61affe', 
                'CONNECTED': '#6a9955', 
                'DISCONNECTED': '#f48771',
                'ERROR': '#f48771',
                'PING': '#555',
                'PONG': '#555'
            };
            const color = actionColors[log.action] || '#b267e6';
            div.style.borderLeftColor = color;
            
            // 使用 JSON 树渲染逻辑
            const isPingPong = log.action === 'PING' || log.action === 'PONG';
            const isObject = log.content && typeof log.content === 'object';
            const contentHtml = isObject 
                ? formatJsonView(log.content) 
                : `<span class="json-string">${log.content}</span>`;

            div.innerHTML = `<div class="log-info-meta">
                <span class="time">${log.timeStr}</span>
                <span class="tag" style="background:${color}">${log.action}</span>
                <span class="device-name-tag">[${log.name}]</span>
                <span class="copy-btn" id="copy-socket-btn">[复制]</span>
                ${isObject ? `
                    <span class="copy-btn" style="color: #858585" id="expand-socket-btn">[展开]</span>
                    <span class="copy-btn" style="color: #858585" id="collapse-socket-btn">[收起]</span>
                ` : ''}
            </div>
            <div class="log-content" style="color: ${isPingPong ? '#666' : '#ce9178'}" onmouseover="handleSocketHover(event)">${contentHtml}</div>`;
            
            const copyBtn = div.querySelector('#copy-socket-btn');
            copyBtn.onclick = () => {
                const text = isObject ? JSON.stringify(log.content, null, 2) : String(log.content);

        function refreshSocketDisplay() {
            const list = document.getElementById('socket-list'); list.innerHTML = '';
            const term = document.getElementById('socketSearchInput').value.toLowerCase();
            let logs = socketLogs.filter(l => (currentDeviceId === 'all' || l.id === currentDeviceId) && (!term || l.action.toLowerCase().includes(term) || JSON.stringify(l.content).toLowerCase().includes(term)));
            logs.sort((a, b) => sortDesc ? b.ts - a.ts : a.ts - b.ts);

            // 列表渲染后应用高亮

        let socketSearchMatches = [];
        let socketSearchIndex = -1;

        function applySocketHighlights(term) {
            const list = document.getElementById('socket-list');
            const nav = document.getElementById('socket-search-nav');
            const countSpan = document.getElementById('socket-search-count');
            
            socketSearchMatches = [];
            socketSearchIndex = -1;

            // 深度遍历文本节点
            const walker = document.createTreeWalker(list, NodeFilter.SHOW_TEXT, null, false);
            const nodes = [];
            while(walker.nextNode()) nodes.push(walker.currentNode);

            nodes.forEach(node => {
                let textNode = node;
                while (true) {
                    const content = textNode.nodeValue;
                    const idx = content.toLowerCase().indexOf(term);
                    if (idx === -1) break;

                    const span = document.createElement('span');
                    span.className = 'search-match';
                    const middle = textNode.splitText(idx);
                    textNode = middle.splitText(term.length);
                    span.appendChild(middle.cloneNode(true));
                    middle.parentNode.replaceChild(span, middle);
                    socketSearchMatches.push(span);
                }
            });

            if (socketSearchMatches.length > 0) {
                nav.style.display = 'flex';
                socketSearchIndex = 0;
                updateSocketSearchNav();
                jumpToSocketMatch(0);
            } else {
                nav.style.display = 'none';
            }
        }

        function navSocketSearch(dir) {
            if (socketSearchMatches.length === 0) return;
            socketSearchMatches[socketSearchIndex].classList.remove('current');
            socketSearchIndex = (socketSearchIndex + dir + socketSearchMatches.length) % socketSearchMatches.length;
            updateSocketSearchNav();
            jumpToSocketMatch(socketSearchIndex);

            document.getElementById('socket-search-count').innerText = `${socketSearchIndex + 1}/${socketSearchMatches.length}`;
        }

            const el = socketSearchMatches[index];
            el.classList.add('current');

        function refreshDisplay() {
            const list = document.getElementById('log-list'); list.innerHTML = '';
            const term = document.getElementById('searchInput').value.toLowerCase();
            const level = document.getElementById('levelFilter').value;
            let logs = allLogs.filter(l => (currentDeviceId==='all'||l.id===currentDeviceId) && (level==='all'||l.level===level) && (!term || JSON.stringify(l.content).toLowerCase().includes(term)));

        function renderDetailSection(title, data) {
            if (!data || (typeof data === 'object' && Object.keys(data).length === 0)) return '';
            const raw = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            return `<div class="detail-section">
                <div class="detail-header">
                    <div class="detail-title">${title}</div>
                    <span class="copy-btn" onclick="copyRaw(this, ${JSON.stringify(raw).replace(/"/g, '&quot;')})">[复制]</span>
                    <span class="copy-btn" style="color: #858585" onclick="toggleAllJson(this, true)">[全部展开]</span>
                    <span class="copy-btn" style="color: #858585" onclick="toggleAllJson(this, false)">[全部收起]</span>
                    <div class="json-search-container">
                        <input type="text" class="json-search-input" placeholder="搜索参数..." 
                            oninput="searchInJson(this)" onkeydown="if(event.key==='Enter') navSearch(this, 1)">
                        <button class="nav-btn" onclick="event.stopPropagation(); navSearch(this, -1)" disabled>◀</button>
                        <button class="nav-btn" onclick="event.stopPropagation(); navSearch(this, 1)" disabled>▶</button>
                        <span class="search-count" style="font-size:10px; color:#666; display:none;">0/0</span>
                    </div>
                </div>
                <div class="json-breadcrumb" onclick="copyPath(this)">Path: <span>root</span></div>
                <div class="detail-content" onmouseover="handleJsonHover(event)">${formatJsonView(data)}</div>
            </div>`;
        }

        function handleJsonHover(e) {
            const row = e.target.closest('.json-row, .json-summary');
            if (!row) return;
            const path = row.getAttribute('data-path');
            if (path) {
                const breadcrumb = row.closest('.detail-section').querySelector('.json-breadcrumb span');
                breadcrumb.innerText = path;
            }
        }

        function copyPath(el) {
            const path = el.querySelector('span').innerText;
            navigator.clipboard.writeText(path).then(() => {
                const original = el.innerHTML;
                el.innerText = '已复制路径!';
                setTimeout(() => el.innerHTML = original, 1000);
            });
        }

        function searchInJson(input) {
            const term = input.value.toLowerCase();
            const section = input.closest('.detail-section');
            const tree = section.querySelector('.json-tree');
            const container = input.closest('.json-search-container');
            const btns = container.querySelectorAll('.nav-btn');
            const countSpan = container.querySelector('.search-count');
            searchState.set(section, { matches: [], index: -1 });
            tree.querySelectorAll('.search-match').forEach(el => { el.replaceWith(document.createTextNode(el.textContent)); });
            tree.normalize();
            if (!term) { countSpan.style.display = 'none'; btns.forEach(b => b.disabled = true); return; }
            const walker = document.createTreeWalker(tree, NodeFilter.SHOW_TEXT, null, false);
            const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
            const matches = [];
            nodes.forEach(node => {
                let textNode = node;
                while (true) {
                    const content = textNode.nodeValue; const idx = content.toLowerCase().indexOf(term);
                    if (idx === -1) break;
                    const span = document.createElement('span'); span.className = 'search-match';
                    const middle = textNode.splitText(idx); textNode = middle.splitText(term.length);
                    span.appendChild(middle.cloneNode(true)); middle.parentNode.replaceChild(span, middle);
                    matches.push(span);
                }
            });
            if (matches.length > 0) {
                searchState.set(section, { matches, index: 0 }); updateSearchNav(section);
                const first = matches[0]; first.classList.add('current');
                let p = first.parentElement; while(p && p !== tree) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
                setTimeout(() => scrollToMatch(first), 50);
            } else { countSpan.innerText = `0/0`; countSpan.style.display = 'inline'; btns.forEach(b => b.disabled = true); }
        }

        function navSearch(el, dir) {
            const section = el.closest('.detail-section');
            const state = searchState.get(section);
            if (!state || state.matches.length === 0) return;
            state.matches[state.index].classList.remove('current');
            state.index = (state.index + dir + state.matches.length) % state.matches.length;
            const current = state.matches[state.index]; current.classList.add('current');
            let p = current.parentElement; const tree = section.querySelector('.json-tree');
            while(p && p !== tree) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
            setTimeout(() => { scrollToMatch(current); updateSearchNav(section); }, 50);
        }

        function updateSearchNav(section) {
            const state = searchState.get(section); const container = section.querySelector('.json-search-container');
            const btns = container.querySelectorAll('.nav-btn'); const countSpan = container.querySelector('.search-count');
            countSpan.innerText = `${state.index + 1}/${state.matches.length}`;
            countSpan.style.display = 'inline'; btns.forEach(b => b.disabled = state.matches.length === 0);
        }

        function scrollToMatch(el) { el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' }); }

        function formatJsonView(data) {
            let obj = data;
            if (typeof data === 'string') { try { obj = JSON.parse(data); } catch(e) { return `<span class="json-string">${data}</span>`; } }
            return `<div class="json-tree">${createJsonTreeNode(obj, true, "root")}</div>`;
        }

        function createJsonTreeNode(data, isRoot = false, path = "") {
            if (data === null) return `<span class="json-null" data-path="${path}">null</span>`;
            const type = typeof data;
            if (type !== 'object') {
                const val = type === 'string' ? `"${data}"` : data;
                return `<span class="json-${type}" data-path="${path}">${val}</span>`;
            }
            const isArray = Array.isArray(data);
            const keys = Object.keys(data);
            if (keys.length === 0) return isArray ? '[]' : '{}';
            let html = `<details class="json-item" ${isRoot?'open':''}>`;
            html += `<summary class="json-summary" data-path="${path}">${isArray?'Array':'Object'}<span class="json-size">${keys.length} items</span></summary>`;
            html += `<div class="json-content">`;
            keys.forEach((key, index) => {
                const subPath = isArray ? `${path}[${index}]` : (path ? `${path}.${key}` : key);
                html += `<div class="json-row" data-path="${subPath}">`;
                if (isArray) html += `<span class="json-key" style="opacity: 0.6">[${index}]:</span>`;
                else html += `<span class="json-key">"${key}":</span>`;
                html += createJsonTreeNode(data[key], false, subPath);
                html += `</div>`;
            });
            html += `</div></details>`;
            return html;
        }

        function toggleAllJson(btn, isOpen) { btn.closest('.detail-section').querySelectorAll('details').forEach(d => d.open = isOpen); }
        function copyRaw(btn, text) { navigator.clipboard.writeText(text).then(() => { const old = btn.innerText; btn.innerText = '[已复制!]'; btn.style.color = '#4caf50'; setTimeout(() => { btn.innerText = old; btn.style.color = 'var(--accent-color)'; }, 1000); }); }
        function getMethodColor(m) { return {GET:'var(--method-get)',POST:'var(--method-post)',PUT:'var(--method-put)',DELETE:'var(--method-delete)'}[m] || '#858585'; }
        function formatTime(ms) { const d = new Date(ms); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`; }
        function saveToLocal() { localStorage.setItem('konvy_devices', JSON.stringify(Array.from(devices.entries()))); }
        function updateLevelFilter() {
            const f = document.getElementById('levelFilter'); const cur = f.value;
            f.innerHTML = '<option value="all">所有级别 (All)</option>';
            Array.from(observedLevels).sort().forEach(l => { const o = document.createElement('option'); o.value=l; o.innerText=l; f.appendChild(o); });
            f.value = observedLevels.has(cur) ? cur : 'all';
        }
        function updateDeviceList() {
            const list = document.getElementById('device-list');
            list.innerHTML = '';
            
            // 获取当前有数据的设备 ID 集合
            const activeIds = new Set([
                ...allLogs.map(l => l.id),
                ...networkLogs.map(l => l.id),
                ...socketLogs.map(l => l.id)
            ]);

            let visibleDevices = [];
            devices.forEach((data, id) => {
                if (activeIds.has(id)) {
                    visibleDevices.push({ id, ...data });
                }
            });

            // 如果当前没选中设备，或者选中的设备已经没数据了，自动选中第一个
            if (visibleDevices.length > 0) {
                const stillExists = visibleDevices.some(d => d.id === currentDeviceId);
                if (!currentDeviceId || !stillExists) {
                    currentDeviceId = visibleDevices[0].id;
                    localStorage.setItem('last_selected_device', currentDeviceId);
                }
            }

            visibleDevices.forEach((data) => {
                const id = data.id;
                const meta = data.metadata || {};
                const fields = [{k:'UID',v:meta.user_id},{k:'User',v:meta.username},{k:'Version',v:meta.appVersion},{k:'OS',v:meta.osVersion},{k:'IMEI',v:meta.imei},{k:'FCM',v:meta.fcm_token},{k:'Copy',v:meta.copyText}];
                const displayName = meta.username ? `${data.name} (${meta.username})` : data.name;
                const group = document.createElement('div');
                group.className = `device-group ${currentDeviceId===id?'expanded':''}`;
                let detailsHtml = '<div class="device-details">';
                fields.forEach(f => { if(f.v) detailsHtml += `<div class="info-row"><div class="info-key">${f.k}:</div><div class="info-val" title="${f.v}">${f.v}</div><span class="copy-btn" onclick="copyText('${f.v}', event)">[复制]</span></div>`; });
                detailsHtml += '</div>';
                
                detailsHtml += `
                    <div class="command-zone">
                        <input type="text" class="command-input" placeholder="输入要下发复制的文本..." id="cmd-${id}">
                        <button class="command-btn" onclick="sendToClipboard('${id}', event)">发送到设备剪贴板</button>
                    </div>
                `;

                group.innerHTML = `<div class="device-item ${currentDeviceId===id?'active' :''}" onclick="selectDevice('${id}')"><div style="display:flex; align-items:center"><div style="width:8px;height:8px;background:#2196f3;border-radius:50%;margin-right:10px"></div><span>${displayName}</span></div><svg class="chevron" viewBox="0 0 24 24" width="12" height="12"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" fill="#858585"/></svg></div><div class="device-details">${detailsHtml}</div>`;
                list.appendChild(group);
            });
        }

        async function sendToClipboard(deviceId, event) {
            event.stopPropagation();
            const input = document.getElementById(`cmd-${deviceId}`);
            const text = input.value.trim();
            if (!text) return alert('请输入文本');

            const btn = event.target;
            const oldText = btn.innerText;
            btn.innerText = '发送中...';
            btn.disabled = true;

            try {
                // 利用 report 接口的特殊 action 下发指令
                const res = await fetch(`${REPORT_API}?action=push_command`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'konvy-debug-2026' // 与环境配置一致
                    },
                    body: JSON.stringify({
                        deviceId: deviceId,
                        command: 'copy_to_clipboard',
                        payload: text
                    })
                });

                if (res.ok) {
                    btn.innerText = '✅ 已排队 (待手机抓取)';
                    input.value = '';
                } else {
                    btn.innerText = '❌ 发送失败';
                }
            } catch (e) {
                console.error(e);
                btn.innerText = '❌ 错误';
            } finally {
                setTimeout(() => {
                    btn.innerText = oldText;
                    btn.disabled = false;
                }, 2000);
            }
        }

        function selectDevice(id) { 
            currentDeviceId = id; 
            localStorage.setItem('last_selected_device', id);
            updateDeviceList(); 
            if (currentTab === 'logs') refreshDisplay();
            else if (currentTab === 'network') refreshNetworkDisplay();
            else if (currentTab === 'socket') refreshSocketDisplay();
            
            // 移动端点击后自动收起侧边栏
            if (window.innerWidth <= 768) {
                toggleMobileSidebar();
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }

        function copyText(t, e) { e.stopPropagation(); navigator.clipboard.writeText(t).then(() => alert('已复制')); }
        function toggleSort() { sortDesc = !sortDesc; document.getElementById('sortBtn').innerText = sortDesc ? "排序: 最新优先 ↓" : "排序: 最旧优先 ↑"; refreshDisplay(); if(currentTab==='socket') refreshSocketDisplay(); }
        function clearLogs() { 
            allLogs=[]; networkLogs=[]; socketLogs=[]; 
            updateDeviceList(); // 清空后重新计算可见设备
            currentTab==='logs'?refreshDisplay():(currentTab==='network'?refreshNetworkDisplay():refreshSocketDisplay()); 
        }
        function resetDevices() { if(confirm("确定重置？")) { localStorage.removeItem('konvy_devices'); devices=new Map(); updateDeviceList(); } }
        document.getElementById('searchInput').oninput = () => refreshDisplay();
        document.getElementById('networkSearchInput').oninput = () => refreshNetworkDisplay();
    </script>
</body>
</html>
